name: LineageOS 15.1 (me1ds)

# Disk, Java 8 and ncurses5 setup follow Windy-Xiaofei/gn3002-phoenix's
# LineageOS 15.1 workflow for MT6735 on hosted runners.
on:
  push:
    branches: [lineage-15.1]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      target:
        description: "make targets (target-files-package otatools, or systemimage kernel ramdisk)"
        required: false
        default: "target-files-package otatools"

concurrency:
  group: lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: dt

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/lib/jvm/*11* /usr/lib/jvm/*17* /usr/lib/jvm/*21* 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          sudo mkdir -p /mnt/out && sudo chown "$USER" /mnt/out
          df -h / /mnt

      - name: Load signing keys
        env:
          SIGNING_KEYS: ${{ secrets.SIGNING_KEYS }}
        run: |
          [ -n "$SIGNING_KEYS" ] || { echo "SIGNING_KEYS secret missing"; exit 1; }
          mkdir -p ~/.android-certs && chmod 700 ~/.android-certs
          echo "$SIGNING_KEYS" | base64 -d | tar -xz -C ~/.android-certs
          for k in releasekey platform shared media testkey; do
            openssl x509 -in ~/.android-certs/$k.x509.pem -noout -subject
          done

      - name: Install Java 8 and build dependencies
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://packages.adoptium.net/artifactory/api/gpg/key/public \
            | sudo gpg --dearmor -o /etc/apt/keyrings/adoptium.gpg
          echo "deb [signed-by=/etc/apt/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends temurin-8-jdk \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick libelf-dev liblz4-tool libncurses-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python2 \
            lib32z1-dev clang llvm binutils-arm-none-eabi
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          JH=$(ls -d /usr/lib/jvm/temurin-8-jdk-* | head -1)
          # Jack server talks TLSv1/1.1, disabled in current Java 8 builds
          sudo sed -i 's/TLSv1, TLSv1.1, //' "$JH"/jre/lib/security/java.security
          grep -n "^jdk.tls.disabledAlgorithms" -A1 "$JH"/jre/lib/security/java.security
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"
          # AOSP 8.1 prebuilt clang links against libncurses.so.5 / libtinfo.so.5
          B=http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses
          cd /tmp
          curl -fsSLO "$B/libtinfo5_6.2-0ubuntu2.1_amd64.deb"
          curl -fsSLO "$B/libncurses5_6.2-0ubuntu2.1_amd64.deb"
          curl -fsSLO "http://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/libmpfr4_3.1.4-1_amd64.deb"
          sudo dpkg -i libtinfo5_*.deb libncurses5_*.deb libmpfr4_*.deb
          git lfs install --skip-repo

      - name: Sync LineageOS 15.1
        run: |
          mkdir -p ~/bin && curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo && export PATH=~/bin:$PATH
          git config --global user.name ci && git config --global user.email ci@localhost
          git config --global color.ui false
          mkdir -p rom/.repo/local_manifests && cd rom
          repo init -q -u https://github.com/LineageOS/android.git -b lineage-15.1 --depth=1
          cat > .repo/local_manifests/me1ds.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="gh" fetch="https://github.com/" />
            <project name="GabrielNeugebauer/android_device_coolpad_mt6735-common" path="device/coolpad/mt6735-common" remote="gh" revision="me1ds-lineage-15.1" clone-depth="1" />
            <project name="GabrielNeugebauer/android_kernel_coolpad_CP8298_I00" path="kernel/lge/me1ds" remote="gh" revision="feat/me1ds-board-23-11-2026" clone-depth="1" />
            <project name="GabrielNeugebauer/proprietary_vendor_coolpad" path="vendor/coolpad" remote="gh" revision="me1ds-lineage-15.1" clone-depth="1" />
          </manifest>
          EOF
          repo sync -q -c -j$(( $(nproc) * 2 )) --force-sync --no-clone-bundle --no-tags --optimized-fetch
          # repo skips submodules; ReSukiSU wants a full git checkout (its
          # version code is the commit count) at the commit the kernel pins.
          K=kernel/lge/me1ds
          KS=$(git -C $K ls-tree HEAD KernelSU | awk '{print $3}')
          rm -rf $K/KernelSU
          git clone -q -b me1ds-3.18 https://github.com/GabrielNeugebauer/BakaSU $K/KernelSU
          git -C $K/KernelSU checkout -q "$KS"
          echo "KernelSU $KS, version $(( 30700 + $(git -C $K/KernelSU rev-list --count HEAD) ))"
          mkdir -p device/lge/me1ds
          rsync -a --exclude .git ../dt/ device/lge/me1ds/
          for p in arm arm64; do
            (cd external/chromium-webview/prebuilt/$p && git lfs pull)
            unzip -tq external/chromium-webview/prebuilt/$p/webview.apk
          done
          df -h / /mnt

      - name: Build
        run: |
          cd rom
          export OUT_DIR=/mnt/out LC_ALL=C USE_CCACHE=0
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx6g"
          source build/envsetup.sh
          lunch lineage_me1ds-userdebug
          make -j$(nproc) ${{ github.event.inputs.target || 'target-files-package otatools' }} 2>&1 | tail -n 400 > /mnt/out/build-tail.log; s=${PIPESTATUS[0]}
          df -h / /mnt
          exit $s

      - name: Sign with release keys
        run: |
          TF=$(ls /mnt/out/target/product/me1ds/obj/PACKAGING/target_files_intermediates/lineage_me1ds-target_files-*.zip 2>/dev/null | head -1)
          [ -n "$TF" ] || { echo "no target files, skipping signing"; exit 0; }
          cd rom
          R=build/make/tools/releasetools H=/mnt/out/host/linux-x86
          $R/sign_target_files_apks -p $H -o -d ~/.android-certs "$TF" /mnt/out/signed-target_files.zip
          $R/ota_from_target_files -p $H -k ~/.android-certs/releasekey --block --backup=false \
            /mnt/out/signed-target_files.zip /mnt/out/target/product/me1ds/lineage_me1ds-signed-ota.zip
          unzip -p /mnt/out/signed-target_files.zip SYSTEM/build.prop | grep -E "^ro.build.(tags|fingerprint)="
          # The signed ramdisk carries the re-keyed plat_mac_permissions.xml
          unzip -p /mnt/out/signed-target_files.zip IMAGES/boot.img > /mnt/out/signed-boot.img
          python3 - /mnt/out/signed-boot.img /mnt/out/target/product/me1ds/ramdisk-signed.img <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          assert b[:8] == b"ANDROID!"
          ks, _, rs = struct.unpack_from("<III", b, 8)
          ps = struct.unpack_from("<I", b, 36)[0]
          off = ps * (1 + (ks + ps - 1) // ps)
          open(sys.argv[2], "wb").write(b[off:off + rs])
          PY
          ls -la /mnt/out/target/product/me1ds/ramdisk*.img

      - name: Pack boot.img with kboot64
        run: |
          P=/mnt/out/target/product/me1ds
          K=$P/obj/KERNEL_OBJ/arch/arm64/boot
          mkdir -p dist
          LD=arm-none-eabi-ld LDEMU= dt/tools/kboot64/build.sh $K/Image $K/dts/me1ds.dtb dist/kboot64-dtb
          RD=$P/ramdisk.img; [ -f $P/ramdisk-signed.img ] && RD=$P/ramdisk-signed.img
          python3 dt/tools/mkbootimg_mtk.py --kernel dist/kboot64-dtb --ramdisk $RD \
            --cmdline "bootopt=64S3,32N2,32N2 androidboot.hardware=mt6735" \
            --kernel-offset 0x00008000 -o dist/boot-me1ds.img
          Z=$(ls $P/lineage_me1ds-signed-ota.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            N=lineage-15.1-$(date -u +%Y%m%d)-UNOFFICIAL-me1ds.zip
            # Flashable zip: kboot64 boot image instead of the AOSP one, and
            # the by-name path the installer uses (TWRP only creates
            # mtk-msdc.0/by-name).
            W=$(mktemp -d) && cp "$Z" dist/$N && Z=dist/$N
            cp dist/boot-me1ds.img $W/boot.img
            mkdir -p $W/META-INF/com/google/android
            unzip -p "$Z" META-INF/com/google/android/updater-script > $W/us
            # sign_target_files_apks only re-tags VENDOR/build.prop; here vendor
            # lives in /system, so fix its fingerprint or Lineage reports a
            # vendor image mismatch.
            unzip -p /mnt/out/signed-target_files.zip SYSTEM/vendor/build.prop \
              | sed 's#:userdebug/test-keys$#:userdebug/release-keys#' > $W/vendor-build.prop
            grep fingerprint $W/vendor-build.prop
            python3 - $W/us <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          B = "/dev/block/platform/mtk-msdc.0/11230000.msdc0/by-name"
          anchor = 'package_extract_file("boot.img", "%s/boot");' % B
          assert s.count(anchor) == 1
          add = ('mount("ext4", "EMMC", "%s/system", "/system", "");\n'
                 'package_extract_file("vendor-build.prop", "/system/vendor/build.prop");\n'
                 'set_metadata("/system/vendor/build.prop", "uid", 0, "gid", 0, "mode", 0600, "capabilities", 0x0, "selabel", "u:object_r:vendor_file:s0");\n'
                 'unmount("/system");\n') % B
          open(p, "w").write(s.replace(anchor, add + anchor))
          PY
            B=/dev/block/platform/mtk-msdc.0
            { echo "run_program(\"/sbin/sh\", \"-c\", \"[ -e $B/11230000.msdc0/by-name ] || { mkdir -p $B/11230000.msdc0 && ln -s $B/by-name $B/11230000.msdc0/by-name; }\");"
              cat $W/us; } > $W/META-INF/com/google/android/updater-script
            (cd $W && zip -q -0 "$GITHUB_WORKSPACE/$Z" boot.img && zip -q "$GITHUB_WORKSPACE/$Z" vendor-build.prop META-INF/com/google/android/updater-script)
            head -3 $W/META-INF/com/google/android/updater-script
            (cd dist && md5sum "$(basename "$Z")" > "$(basename "$Z").md5sum")
          else
            cp $K/Image $K/dts/me1ds.dtb $P/ramdisk.img dist/
            [ -f $P/system.img ] && cp $P/system.img dist/ || true
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineage-15.1-me1ds
          if-no-files-found: warn
          path: |
            dist/
            /mnt/out/build-tail.log
